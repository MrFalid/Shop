<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Магазин аккаунтов</title>
<script>
window.onerror=function(m,u,l){var a=document.getElementById("app");if(a)a.innerHTML='<p style="padding:20px;color:#c00;word-break:break-word">Ошибка: '+m+' (строка '+l+')</p>';};
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8a8e);
  --link:var(--tg-theme-link-color,#2481cc);
  --btn:var(--tg-theme-button-color,#2481cc);
  --btx:var(--tg-theme-button-text-color,#fff);
  --sec:var(--tg-theme-secondary-bg-color,#f0f0f3);
  --red:#e5484d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
#app{padding:14px 14px 90px;max-width:560px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:20px;margin:0 0 4px}
input,textarea{width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--sec);color:var(--tx);font:inherit;outline:none;margin-bottom:10px}
textarea{min-height:90px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--sec);color:var(--tx);border:0;font:inherit;font-size:14px}
.chip.on{background:var(--btn);color:var(--btx)}
.card{background:var(--sec);border-radius:14px;padding:14px;margin-bottom:10px}
.card.tap:active{opacity:.7}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{font-weight:700;white-space:nowrap}
.hint{color:var(--hint);font-size:14px}
